{% extends "base.html" %}
{% block title %}Admin Login — {{ country_name }}{% endblock %}
{% block content %}
<h1 class="page-title" style="font-size:22px;">{{ country_name }}<br>Admin Login</h1>

{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="POST" action="/admin/{{ country_code }}/login">
    <input type="password" name="password" class="input-field" placeholder="Admin password" required>
    <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
