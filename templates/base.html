<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}11.11 Office Hunt{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F21B1B;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .kv-banner {
            width: 100%;
            overflow: visible;
            background: #F21B1B;
            line-height: 0;
            position: relative;
        }
        .kv-banner img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            outline: none;
            margin-left: 8px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 20px 0 24px;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .page-subtitle {
            text-align: center;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #fff;
            color: #F21B1B;
        }
        .btn-primary:hover { background: #f0f0f0; }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        .btn-country {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            margin-bottom: 10px;
            padding: 14px 20px;
        }
        .btn-country:hover { background: rgba(255,255,255,0.25); }
        .input-field {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.6); }
        .input-field:focus { border-color: #fff; background: rgba(255,255,255,0.15); }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .card-text {
            font-size: 15px;
            line-height: 1.5;
            opacity: 0.9;
        }
        .error-msg {
            background: rgba(255,0,0,0.3);
            border: 1px solid rgba(255,100,100,0.5);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .success-msg {
            background: rgba(0,200,100,0.2);
            border: 1px solid rgba(0,200,100,0.4);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .progress-label {
            text-align: center;
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        .stop-number {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .clue-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            border: 2px dashed rgba(255,255,255,0.4);
            margin-bottom: 20px;
            text-align: center;
        }
        .leaderboard-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard-row:last-child { border-bottom: none; }
        .rank {
            width: 32px;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
        }
        .rank-1 { color: #FFD700; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }
        .player-name {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        .player-time {
            font-size: 14px;
            opacity: 0.8;
            font-variant-numeric: tabular-nums;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .nav-links .btn { flex: 1; font-size: 14px; padding: 12px; }
        .footer-note {
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            margin-top: 24px;
        }
        .country-flag {
            font-size: 20px;
            margin-right: 8px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .admin-table th {
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 900;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .stop-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .stop-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .stop-card-num {
            font-weight: 700;
            font-size: 14px;
        }
        .stop-card-actions a {
            font-size: 12px;
            margin-left: 8px;
            opacity: 0.7;
        }
        .stop-card-actions a:hover { opacity: 1; }
        .stop-card-location {
            font-size: 14px;
            opacity: 0.8;
        }
        .stop-card-question {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-input:focus { border-color: #fff; }
        .form-input::placeholder { color: rgba(255,255,255,0.5); }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 24px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }
        .back-link {
            display: inline-block;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 16px;
            text-decoration: none;
            color: #fff;
        }
        .back-link:hover { opacity: 1; }
        .hashtag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0;
        }
        @media (max-width: 360px) {
            .page-title { font-size: 24px; }
            .question-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="kv-banner">
        <img src="/static/banner.png" alt="11.11 Biggest Sale of the Year">
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
