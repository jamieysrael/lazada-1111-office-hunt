{% extends "base.html" %}
{% block title %}{{ action_title }} Stop — {{ country_name }}{% endblock %}
{% block content %}
<a href="/admin/{{ country_code }}" class="back-link">&larr; Dashboard</a>
<h1 class="page-title" style="font-size:20px;">{{ action_title }} Pitstop</h1>

{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="POST" action="{{ form_action }}">
    <!-- Regular pitstop fields (always visible) -->
    <div id="regular_fields">
        <div class="form-group">
            <label class="form-label">Location Name</label>
            <input type="text" name="location_name" id="location_name" class="form-input" value="{{ stop.location_name if stop else '' }}" placeholder="e.g. Floor 2 Pantry" required>
        </div>
        <div class="form-group">
            <label class="form-label">Question</label>
            <input type="text" name="question" id="question" class="form-input" value="{{ stop.question if stop else '' }}" placeholder="11.11 trivia question">
        </div>
        <div class="form-group">
            <label class="form-label">Correct Answer</label>
            <input type="text" name="answer" id="answer" class="form-input" value="{{ stop.answer if stop else '' }}" placeholder="Correct answer (case-insensitive)">
        </div>
        <div class="form-group">
            <label class="form-label">Clue to Next Stop</label>
            <input type="text" name="clue_to_next" id="clue_to_next" class="form-input" value="{{ stop.clue_to_next if stop else '' }}" placeholder="Hint pointing to next location">
        </div>
    </div>

    <!-- Is this the final stop checkbox -->
    <div class="form-group">
        <label class="form-label">
            <input type="checkbox" name="is_finale" id="is_finale" {{ 'checked' if stop and stop.is_finale else '' }} onchange="toggleFinale()"> This is the final pitstop
        </label>
    </div>

    <!-- Finale type selection (only visible when is_finale is checked) -->
    <div id="finale_type_section" style="display:none; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px; margin-top: 16px;">
        <div class="form-group">
            <label class="form-label">Final Stop Type</label>
            <div style="display: flex; gap: 20px; margin-top: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="radio" name="finale_type" value="question" id="finale_type_question" onchange="toggleFinaleType()" {{ 'checked' if stop and stop.finale_type == 'question' else '' }}>
                    <span>Question</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="radio" name="finale_type" value="team_photo" id="finale_type_team_photo" onchange="toggleFinaleType()" {{ 'checked' if not stop or stop.finale_type == 'team_photo' else '' }}>
                    <span>Team Photo</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Team Photo fields (visible when finale_type is team_photo) -->
    <div id="team_photo_fields" style="display:none; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px; margin-top: 16px;">
        <div class="form-group">
            <label class="form-label">Final Message</label>
            <input type="text" name="finale_message" class="form-input" value="{{ stop.finale_message if stop else '' }}" placeholder="e.g. You made it to the Team Show Booth!">
        </div>
        <div class="form-group">
            <label class="form-label">Final Task</label>
            <textarea name="finale_task" class="form-input" rows="3" placeholder="e.g. 1. Take a team photo at this booth&#10;2. Post it on Buzz with the hashtag below&#10;3. Paste your Buzz post URL to complete the hunt!">{{ stop.finale_task if stop else '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Final Details (optional)</label>
            <textarea name="finale_details" class="form-input" rows="2" placeholder="Any additional details or instructions">{{ stop.finale_details if stop else '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label"># Hashtag</label>
            <input type="text" name="finale_hashtag" class="form-input" value="{{ stop.finale_hashtag if stop else '' }}" placeholder="e.g. 2026BiggestSaleSG">
        </div>
        <div class="form-group">
            <label class="form-label">Input URL Label</label>
            <input type="text" name="finale_input_label" class="form-input" value="{{ stop.finale_input_label if stop else '' }}" placeholder="e.g. Paste your Buzz post URL here...">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">{{ 'Update' if stop else 'Add' }} Pitstop</button>
</form>

<script>
function toggleFinale() {
    var isFinale = document.getElementById('is_finale').checked;
    var finaleTypeSection = document.getElementById('finale_type_section');
    finaleTypeSection.style.display = isFinale ? 'block' : 'none';

    // If not finale, hide all finale-specific fields
    if (!isFinale) {
        document.getElementById('team_photo_fields').style.display = 'none';
        // Make question/answer required for regular stops
        document.getElementById('question').setAttribute('required', '');
        document.getElementById('answer').setAttribute('required', '');
        document.getElementById('clue_to_next').setAttribute('required', '');
    } else {
        // For finale, clue is not required
        document.getElementById('clue_to_next').removeAttribute('required');
        // Update visibility based on finale type
        toggleFinaleType();
    }
}

function toggleFinaleType() {
    var isFinale = document.getElementById('is_finale').checked;
    if (!isFinale) return;

    var isQuestion = document.getElementById('finale_type_question').checked;
    var teamPhotoFields = document.getElementById('team_photo_fields');
    var question = document.getElementById('question');
    var answer = document.getElementById('answer');

    if (isQuestion) {
        // Question mode: show question/answer fields, hide team photo fields
        teamPhotoFields.style.display = 'none';
        question.setAttribute('required', '');
        answer.setAttribute('required', '');
    } else {
        // Team Photo mode: hide question/answer fields, show team photo fields
        teamPhotoFields.style.display = 'block';
        question.removeAttribute('required');
        answer.removeAttribute('required');
        question.value = '';
        answer.value = '';
    }
}

// Run on page load
toggleFinale();
</script>
{% endblock %}
